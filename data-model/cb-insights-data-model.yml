id_domains:
  orgId: CB Insights organization identifier (integer)
  dealId: financial transaction identifier
  relationshipId: business relationship identifier
  personId: management/board person identifier
  roundId / roundCategoryId / roundTypeId: funding round vocabulary
  businessModelId: business model vocabulary
  collectionId: Expert Collection identifier
  sectorId / industryId / subindustryId: taxonomy hierarchy
  marketIds / technologyIds: market and technology taxonomies
  continentId / regionId / countryId / stateProvinceId / cityId: geography vocabulary
  investorTypeId / investorCategoryId: investor classification
  statusId / orgStatusIds: organization status vocabulary
  titleIds: person title vocabulary
  awardsAndSpotlightsId: awards and spotlights vocabulary
  chatID: ChatCBI conversation identifier (string)
  see: vocabulary/cb-insights-vocabulary.yml
notes:
- >-
  Every *Id filter resolves against a published reference vocabulary rather than free text — the
  data model is only usable in combination with the taxonomy reference pages.
- >-
  No entity carries a created/updated timestamp except BusinessRelationship (lastUpdateTime); v1
  exposed lastUpdateTime across organizations, deals, people and business relationships as the
  incremental-sync mechanism.
- >-
  The contract declares no operationIds, so entity operations can only be referenced by METHOD+PATH.
