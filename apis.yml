aid: cb-insights
name: CB Insights
description: >-
  CB Insights (CB Information Services, Inc.) is a New York-based private-market intelligence platform
  covering 12M+ private and public company profiles, funding deals, cap tables, M&A and IPO exits,
  business relationships, management and board data, and proprietary predictive scores (Mosaic,
  Commercial Maturity, Exit Probability, Competitor Score). The company exposes that data
  programmatically through the CB Insights API v2 — a token-authenticated REST API at
  api.cbinsights.com documented with a published Swagger 2.0 contract of 28 operations across
  Firmographics, Financial Transactions, Business Relationships, Management & Board, Outlook,
  Revenue, Strategy Map, Scouting Reports and the ChatCBI research LLM — plus a maintenance-mode v1
  REST API, a hosted OAuth-protected MCP server at mcp.cbinsights.com listed in Claude, ChatGPT,
  Perplexity and Microsoft Copilot connector directories, a Snowflake Marketplace data share with
  Semantic Views and a Cortex Knowledge Extension, and Salesforce and Microsoft 365 Copilot
  connectors. Access is credit-metered and credential-gated: clientId/clientSecret are issued by
  CB Insights, exchanged for a 24-hour bearer token, and every data call debits an account credit
  ledger.
