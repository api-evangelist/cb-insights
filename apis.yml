    url: https://api-docs.cbinsights.com/docs/reference/rate_limiting/
  - type: ErrorCatalog
    url: https://api-docs.cbinsights.com/docs/reference/error_codes/
  x-spec-note: >-
    No machine-readable contract exists for v1. The reference is fully public and richly documented
    at api-docs.cbinsights.com, but CB Insights ships only Hugo-rendered HTML endpoint pages —
    probes of /openapi.json, /openapi.yaml and /swagger.json on that host all returned 404 on
    2026-08-09. The v2 contract in openapi/ does not cover these operations.
- name: CB Insights MCP Server
  description: >-
    Hosted, remote Model Context Protocol server at mcp.cbinsights.com, offered as the supported
    replacement for the deprecated self-hosted cbi-mcp-server reference implementation. Protected by
    OAuth 2.1 with dynamic client registration, PKCE (S256) and RFC 9728 protected-resource
    metadata; connected from Claude, ChatGPT, Perplexity, Microsoft Copilot (Chat, Researcher and
    Excel) via each client's connector directory. Live tools/list is auth-gated.
  humanURL: https://api-docs.cbinsights.com/portal/docs/Integrations/cbi-mcp-server
  baseURL: https://mcp.cbinsights.com/
