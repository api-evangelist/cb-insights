summary: >-
  CB Insights ships no maintained client SDK in any language. The developer portal documents cURL
  and hand-rolled Python `requests` calls only — there is no SDK page, no install snippet, and no
  package badge anywhere in the docs. The one first-party package that exists on a registry is a
  node client last published in 2016 whose source repository has since been deleted. Nothing in this
  file should be treated as a supported integration path.
