cross_cutting_rules:
- Authenticate once per 24 hours; there is no refresh token.
- Resolve orgIds with POST /v2/organizations first — it is the one operation that never charges credits.
- No idempotency key exists and every data call debits the credit ledger, so a retry is billable.
  De-duplicate client-side.
- 424 Failed Dependency means credits are exhausted — stop, do not retry.
- 403 usually means the 24-hour token expired — re-authorize and retry once.
- Rate limit is 100 requests/second across the whole API; pace with ratelimit-remaining / ratelimit-reset.
