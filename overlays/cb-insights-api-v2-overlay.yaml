- target: $.paths[*][*].responses
  description: >-
    Record the two production statuses the contract omits. 429 (rate limit) and its ratelimit-*
    headers are documented in the v1 reference and enforced platform-wide; 404 is documented for
    unknown datapacks. Neither is declared on any v2 operation.
  update:
    x-apievangelist-undeclared-statuses:
      '429':
        description: >-
          Too Many Requests — the 100 requests/second limit was exceeded. Response carries
          ratelimit-limit, ratelimit-remaining and ratelimit-reset.
        source: https://api-docs.cbinsights.com/docs/reference/rate_limiting/
      '404':
        description: Not Found — part of the request could not be identified (e.g. an unknown datapack).
        source: https://api-docs.cbinsights.com/docs/reference/error_codes/
x-apievangelist-gaps:
- No operationId on any of 28 operations.
- basePath is an absolute URL; host and schemes are absent.
- Tag StrategyMap used but not declared in tags[].
- 429 undeclared despite an enforced, documented rate limit.
- Error schema common.ErrorWithCode exposes only a free-text `error` string — no enumerated code.
- No security scheme applied at the document root; each operation repeats both a `security` entry
  and a redundant required `Authorization` header parameter.
- No examples on responses (request-body examples are present on many properties).
