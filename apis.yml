- name: CB Insights API v1
  description: >-
    The original CB Insights REST API — 11 documented GET operations over organizations, deals
    (fundings, investments, portfolio exits), people, business relationships, expert collections and
    the credit ledger, authenticated with a 24-hour JWT from /v1/authorize. Fully documented in a
    static Hugo reference site with a dated change log through v1.9.0 (2024-07-26), but CB Insights
    publishes no OpenAPI for it and directs new integrations to v2.
  humanURL: https://api-docs.cbinsights.com/docs/endpoints/
  baseURL: https://api.cbinsights.com
  tags:
  - market-intelligence
  - private-company-data
  - funding-data
  - investor-data
  - company-data
  properties:
