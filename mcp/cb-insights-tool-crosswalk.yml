summary: >-
  CB Insights ships both an OpenAPI-described REST surface and a hosted MCP server, but the two
  cannot be reconciled from public artifacts: the live tools/list is OAuth-gated and the docs
  tools-reference page renders client-side with no reachable data file. Exactly ONE tool is
  confirmed by name — ChatCBI, from CB Insights' own (now deprecated) reference server — and it
  binds cleanly to POST /v2/chatcbi. Everything else in this file is recorded as REST-only: 27
  documented operations with no publicly confirmed tool behind them. Nothing here asserts a tool
  that CB Insights has not published.
