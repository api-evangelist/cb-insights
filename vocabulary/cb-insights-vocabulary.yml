- name: People Titles
  filter_field: titleIds
  url: https://api-docs.cbinsights.com/docs/reference/person_titles/
  term_count: 71
- name: Stock Exchanges
  filter_field: exchange (organization identifiers)
  url: https://api-docs.cbinsights.com/docs/reference/stock_exchanges/
  term_count: 69
- name: Address (geography)
  filter_field: continentIds / regionIds / countryIds / stateIds / cityIds
  url: https://api-docs.cbinsights.com/docs/reference/address/
  term_count: 56359
  note: >-
    A single 4.6 MB HTML page enumerating every continent, region, country, state/province and city
    id. It is the largest reference artifact in the estate and the least practical to consume — an
    integrator must scrape a multi-megabyte HTML table to resolve a city filter.
- name: Business Models
