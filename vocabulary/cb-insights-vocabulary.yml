summary: >-
  CB Insights publishes a substantial set of controlled vocabularies as reference pages, and they
  are not optional reading: almost every filter on the API is an integer *Id that resolves against
  one of these lists, so the API is unusable without them. They are published as HTML tables only —
  there is no downloadable CSV/JSON, no enum in the OpenAPI contract, and no versioning on any list.
  Term counts below are row counts observed in the published tables on 2026-08-09.
publication_format: HTML tables (Hugo-rendered on api-docs.cbinsights.com, Docusaurus on /portal)
machine_readable: false
versioned: false
enumerated_in_spec: false
enumerated_in_spec_note: >-
  The Swagger contract references these lists by URL inside property descriptions (e.g. "CBI industry
  IDs to match; see .../References/Taxonomy/industries") rather than declaring enum values, so a
  generated client cannot validate a filter id.
vocabularies:
