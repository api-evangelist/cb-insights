summary: >-
  CB Insights publishes no price for anything. The pricing page names three commercial offerings —
  Browser Analyst, Strategy Terminal and Data Solutions — and each one carries a "Request pricing"
  button rather than a rate, a currency, a billing period or a seat count. There is no self-serve
  checkout, no published rate card and no per-credit price anywhere on the public surface. What IS
  published, and is the only quantified entitlement in the estate, is the API trial allowance on the
  developer-portal sign-up form: 25 companies, 5 scouting reports and 5 ChatCBI messages. Because no
  offering has a published price, plan_count is 0 by the definition this artifact uses — the named
  offerings are recorded below as offerings, not as plans, so a reader is not misled into thinking a
  rate exists.
