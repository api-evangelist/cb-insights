scoring_models:
- name: Mosaic Score
  url: https://api-docs.cbinsights.com/docs/reference/mosaic/
  current_version: v2.1
  note: >-
    Proprietary composite health/growth score with sub-scores (momentum, money, market, management).
    The mosaicScoreVersion request field is deprecated — only v2.1 is served.
- name: Credit Model
  url: https://api-docs.cbinsights.com/docs/reference/credit_model/
  note: The metering vocabulary — which call/datapack combination costs how many credits.
- name: Organization-based Credit Model
  url: https://api-docs.cbinsights.com/docs/reference/org_credit_model/
gaps:
- No machine-readable form of any vocabulary (no CSV, JSON, SKOS, or API endpoint that returns the lists).
- No enum declarations in the OpenAPI contract, so filter ids cannot be validated client-side.
- No version or last-modified stamp on any reference list.
- The taxonomy is split across two doc sites — legacy lists on api-docs.cbinsights.com/docs/reference/
  and newer ones under /portal/docs/References/Taxonomy/ — with no single index.
