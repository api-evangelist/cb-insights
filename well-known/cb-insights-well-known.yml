  /.well-known/ surface in the estate belongs to the hosted MCP server at mcp.cbinsights.com,
  which serves RFC 9728 protected-resource metadata, RFC 8414 authorization-server metadata and
  an OpenID-Connect-shaped discovery document. api.cbinsights.com answers EVERY path — including
  /.well-known/* — with 401 "Permission denied for given authorization token", so nothing can be
  read there anonymously.
