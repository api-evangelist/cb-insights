overlay: 1.0.0
info:
  title: API Evangelist enrichment overlay — CB Insights API v2
  version: 1.0.0
extends: ../openapi/cb-insights-api-v2-openapi.json
x-provenance:
  generated: '2026-08-09'
  method: generated
  source: >-
    Enhancements authored by API Evangelist over the verbatim Swagger 2.0 contract harvested from
    https://api-docs.cbinsights.com/v2/cbinsights_api_v2.json on 2026-08-09. The harvested spec is
    never mutated; everything below is our addition, not a CB Insights claim.
  note: >-
    The single largest defect in the published contract is that NOT ONE of its 28 operations
    declares an operationId. Without one there is no stable handle to bind an MCP tool, an Arazzo
    step, an SDK method, or a crosswalk row to — which is exactly why
    mcp/cb-insights-tool-crosswalk.yml has to address operations by METHOD+PATH. The actions below
    propose an operationId for every operation, derived mechanically from the tag and the path.
actions:
- target: $.info
  description: Record provenance and the harvest source on the document root.
  update:
    x-apievangelist-source: https://api-docs.cbinsights.com/v2/cbinsights_api_v2.json
    x-apievangelist-harvested: '2026-08-09'
    x-apievangelist-note: >-
      Swagger 2.0. `basePath` carries a full absolute URL (https://api.cbinsights.com), which is not
      valid Swagger 2.0 — basePath must be a path and the host belongs in `host`. Tools that follow
      the spec strictly will resolve request URLs incorrectly.
- target: $
  description: Declare the tag that is used by an operation but missing from the top-level tags list.
  update:
    x-apievangelist-undeclared-tags:
    - StrategyMap
- target: $.paths['/v2/authorize'].post
  update: {operationId: authorizeClient}
- target: $.paths['/v2/organizations'].post
  update:
    operationId: listOrganizations
    x-apievangelist-metering: free — this operation never charges credits
- target: $.paths['/v2/firmographics'].post
