metering:
  model: credit ledger
  detail: >-
    API usage is metered in credits, not in requests. Each data call debits the account balance by an
    amount that varies by endpoint and datapack, reported per response in the
    x-cbinsights-credits-call-consumed header; a call with no credits left fails with 424. Credit
    allotments are contractual and are not published, and no per-credit price appears anywhere on the
    public surface — so the effective cost of any given API call cannot be determined before signing.
  free_operation: POST /v2/organizations (organization lookup) is documented as never charging credits
  ledger_endpoint: GET /v1/credits
  see: rate-limits/cb-insights-rate-limits.yml
third_party_price_reporting:
  note: >-
    Procurement aggregators and comparison sites publish estimated CB Insights contract values in the
    $30k–$265k/year range. Those are third-party estimates, not a CB Insights publication, so no figure
    is recorded as a price in this artifact.
gaps:
- No price, currency or billing period is published for any offering.
- No published per-credit rate, so the cost of an API call is unknowable before contracting.
- The pricing page never names the API or the MCP server as a purchasable line item, so a developer
  cannot tell from it which offering grants programmatic access.
- No usage calculator, no overage rate, and no published quota per tier.
