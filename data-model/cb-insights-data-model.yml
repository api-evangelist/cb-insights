generated: '2026-08-09'
method: derived
source: >-
  openapi/_original/cb-insights-api-v2-openapi.json (115 definitions, $ref graph + id-reference fields),
  cross-checked against https://api-docs.cbinsights.com/portal/docs/CBI-API/cbi-api-overview
summary: >-
  A single-hub model. CB Insights states it outright in its own overview — "the Organization entity
  serves as the fundamental building block of our data model, with all other entities linked to it
  directly or indirectly" — and the contract bears it out: orgId appears in 18 of 115 definitions
  and is the only identifier accepted by every non-search operation. Every integration therefore has
  the same shape: resolve your universe to orgIds first (via the free organization-lookup
  operation), then fan out per data category. Deals and business relationships are the only entities
  that link organizations to each other.
primary_key:
  name: orgId
  type: integer
  description: CB Insights organization identifier. The hub key for the entire model.
  obtained_from:
  - POST /v2/organizations (lookup by name, url, or profileUrl — never charges credits)
  - POST /v2/firmographics (full search)
  note: >-
    All other data endpoints except ChatCBI require an orgId that has already been resolved. There is
    no way to address an organization by domain or name on the category endpoints.
entities:
- name: Organization
  schema: v2Firmographics.Org
  id: orgId
  description: >-
    A company, investor, or other entity. Carries summary (name, aliases, legal names, url,
    additionalUrls, profileUrl, description, foundedYear, status, stage, vcBacked, investorCategory,
    address), taxonomy, identifiers, financials, headcount, businessModels, expertCollections,
    competitors, parentOrgs and childOrgs.
- name: OrganizationLookup
  schema: v2OrganizationLookup.Org
  id: orgId
  description: Thin projection of Organization — just enough to confirm identity and obtain the orgId.
- name: Identifiers
  schema: v2Firmographics.Identifiers
  description: >-
    External security/entity identifiers on an organization — stock tickers and exchanges, CUSIP,
    ISIN, FIGI (OpenFIGI), LEI, SEC CIK. These are the join keys to outside reference data.
- name: FinancialTransaction
  schema: v2FinancialTransactions.Transaction
  id: dealId
  description: >-
    A funding round, investment, or exit. Carries date, amountInMillions, valuationInMillions,
    round/roundCategory/roundId, investors, recipient, revenue range and multiple, isExit, sources
    and AI-generated insights.
- name: CapTable
  schema: v2FinancialTransactions.CapTable
  description: Capitalization history attached to funding transactions, including preference terms.
- name: Terms
  schema: v2FinancialTransactions.Terms
  description: >-
    Deal terms — antiDilutionProvisionId, dividendPreferenceId, liquidationPreferenceId,
    participationRightsId.
- name: Investor
  schema: v2FinancialTransactions.Investor
  description: An organization acting in the investor role on a transaction.
- name: BusinessRelationship
  schema: v2BusinessRelationships.BusinessRelationship
  id: relationshipId
  description: >-
    A partnership, client/vendor, or licensing tie between two or more organizations. Carries
    partners, startDate, lastUpdateTime, news snippets, sources and AI-generated insights.
- name: Person
  schema: v2ManagementAndBoard.Person
  id: personId
  description: >-
    A management-team or board member — givenName, middleName, surname, email, linkedInUrl,
    workExperience, education, boardAssociations.
- name: Outlook
  schema: v2Outlook.OrgOutlookResponse
  description: >-
    The proprietary score bundle for an organization — mosaicScore, commercialMaturity,
    exitProbability. Each has a history variant and a signals/insights breakdown.
- name: MosaicScore
  schema: v2Outlook.MosaicScore
  description: Composite health/growth score with sub-scores; only Mosaic v2.1 is served.
- name: CommercialMaturity
  schema: v2Outlook.CommercialMaturity
  description: Maturity level plus supporting signals.
- name: ExitProbability
  schema: v2Outlook.CurrentExitProbability
  description: Exit likelihood broken out with exit signals.
- name: FundingWindow
  schema: v2Outlook.FundingWindowOrg
  description: Predicted funding-window data for an organization.
- name: RevenueYear
  schema: v2Revenue.RevenueYear
  description: Revenue by year with source metadata; revenueSignalId is deprecated and always null.
- name: ScoutingReport
  schema: v2ScoutingReports.ScoutingReportResponse
  description: >-
    On-demand AI-generated report for an organization, returned as both reportJson and
    reportMarkdown, with an orgInfo header. A streaming variant exists.
- name: StrategyMap
  schema: v2StrategyMap.StrategyMapResponse
  description: >-
    Categorised map of an organization's strategy — categories, companies, connections, financial
    events and business relationships, plus insights.
- name: Taxonomy
  schema: v2Firmographics.Taxonomy
  description: Sector > Industry > Sub-industry classification, plus markets and technologies.
- name: BusinessModel
  schema: v2Firmographics.BusinessModel
  id: businessModelId
  description: Controlled business-model classification.
- name: ExpertCollection
  schema: v2Firmographics.ExpertCollection
  id: collectionId
  description: Analyst-curated list an organization belongs to.
- name: Address
  schema: v2Firmographics.Address
  description: Geographic location keyed by continentId, countryId, stateProvinceId, cityId.
- name: Competitor
  schema: v2Firmographics.Competitor
  description: A related organization with a Competitor Score.
- name: ChatCBIConversation
  schema: v2ChatCBI.ChatCBIResponse
  id: chatID
  description: >-
    A conversation with the ChatCBI research LLM. Carries message, sources, relatedContent,
    suggestions and title. The only stateful entity in the API — chatID threads turns together.
