apis:
- name: CB Insights API v2
  description: >-
    Token-authenticated REST API over CB Insights private-market intelligence. 28 POST operations
    across eight tags — Authorization, Organizations, Firmographics, FinancialTransactions,
    BusinessRelationships, ManagementAndBoard, Outlook and ScoutingReports — plus the ChatCBI and
    CBI RAG research endpoints. Search bodies are JSON; results are cursor-paginated with
    nextPageToken/totalHits; every data call debits the account credit ledger.
  humanURL: https://api-docs.cbinsights.com/portal/docs/api/
  baseURL: https://api.cbinsights.com
